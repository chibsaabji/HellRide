<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Center | HellRide</title>
  <meta name="description" content="HellRide Command Center - Authenticate to manage the ultimate hyper-performance vehicle marketplace.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/x-icon" href="./Wheel.ico">
</head>

<body>

  <div class="login-split">
    <!-- Left Side: Cinematic Image -->
    <div class="login-left">
      <div class="login-left-bg"></div>
      <div class="login-left-content">
        <a href="./index.html">
          <img src="./Logo/Logo.png" alt="HellRide Logo" style="height: 6rem;" />
        </a>
      </div>
    </div>

    <!-- Right Side: Login Panel -->
    <div class="login-right">
      <div class="login-panel">

        <!-- Mobile Logo (visible only on <=899px) -->
        <div class="login-mobile-logo">
          <a href="./index.html">
            <img src="./Logo/Logo.png" alt="HellRide Logo" />
          </a>
        </div>

        <h2>Access Terminal</h2>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">Authenticate to enter the command center.</p>

        <!-- Tabs -->
        <div class="login-tabs">
          <button class="login-tab active" data-target="view-user">User</button>
          <button class="login-tab" data-target="view-staff">Staff</button>
          <button class="login-tab" data-target="view-signup">Sign Up</button>
        </div>

        <div class="login-view-container">
          <!-- User Login View -->
          <div id="view-user" class="login-view active">
            <button class="google-btn">
              <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4" />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853" />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="#FBBC05" />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335" />
              </svg>
              Continue with Google
            </button>

            <div class="login-divider">or</div>

            <form id="user-login-form">
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="client@example.com" required>
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn primary full glow" style="margin-top: 1rem;">Sign In</button>
            </form>
          </div>

          <!-- Staff Login View -->
          <div id="view-staff" class="login-view">
            <form id="staff-login-form">
              <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="staff-user" class="form-control" placeholder="admin" required>
              </div>
              <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="staff-pass" class="form-control" placeholder="••••••••" required>
              </div>
              <p id="staff-login-error"
                style="color: #ff4d4d; font-size: 0.875rem; margin-top: -0.5rem; margin-bottom: 1rem; display: none;">
                Invalid credentials</p>
              <button type="submit" class="btn primary full glow"
                style="margin-top: 1rem; background: var(--accent-olive); color: #000; box-shadow: 0 0 20px rgba(112, 130, 56, 0.4);">Secure
                System Login</button>
            </form>
          </div>

          <!-- Sign Up View -->
          <div id="view-signup" class="login-view">
            <button class="google-btn">
              <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4" />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853" />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="#FBBC05" />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335" />
              </svg>
              Sign up with Google
            </button>

            <div class="login-divider">or</div>

            <form id="signup-form">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" class="form-control" placeholder="John Doe" required>
              </div>
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="client@example.com" required>
              </div>
              <div class="form-group">
                <label>Create Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn outline full glow" style="margin-top: 1rem;">Create Account</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    lucide.createIcons();

    // Tab Switching Logic
    const tabs = document.querySelectorAll('.login-tab');
    const views = document.querySelectorAll('.login-view');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Remove active class from all
        tabs.forEach(t => t.classList.remove('active'));
        views.forEach(v => v.classList.remove('active'));

        // Add active class to clicked tab and corresponding view
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    // Handle Staff Login
    const staffForm = document.getElementById('staff-login-form');
    const staffError = document.getElementById('staff-login-error');

    staffForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('staff-user').value;
      const password = document.getElementById('staff-pass').value;

      try {
        const res = await fetch( (import.meta.env.VITE_API_URL || '') + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('ag_admin_token', data.token);
          staffError.style.display = 'none';
          window.location.href = '/admin.html';
        } else {
          staffError.style.display = 'block';
        }
      } catch (err) {
        console.error('Login error', err);
      }
    });

    // Mock User Logic
    document.getElementById('user-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('User login simulated! Redirecting to dashboard...');
      window.location.href = '/index.html';
    });

    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Sign up simulated! Welcome to HellRide.');
      window.location.href = '/index.html';
    });

    // Google Auth Logic
    const GOOGLE_CLIENT_ID = '60625372849-vd9koq1bcuo25oqgb1ss88e4oh4m362q.apps.googleusercontent.com'; // <-- Real Google Client ID

    let tokenClient;

    // Initialize Google GIS Token Client when window loads
    window.onload = () => {
      if (window.google && window.google.accounts) {
        if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID_HERE') {
          console.warn("Please replace 'YOUR_GOOGLE_CLIENT_ID_HERE' in login.html to make Google Auth work.");
          return;
        }

        tokenClient = google.accounts.oauth2.initCodeClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile openid',
          ux_mode: 'popup',
          callback: async (response) => {
            if (response.error) {
              console.error('Google Login Error:', response);
              return;
            }

            // Send the auth code to our backend for exchange
            try {
              const res = await fetch( (import.meta.env.VITE_API_URL || '') + '/api/google-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: response.code })
              });

              if (res.ok) {
                const data = await res.json();
                localStorage.setItem('ag_user_token', data.token);
                alert(`Welcome ${data.user.name}!`);
                window.location.href = '/index.html';
              } else {
                const errText = await res.text();
                alert(`Server Error ${res.status}: ${errText}`);
              }
            } catch (err) {
              console.error(err);
              alert('Network Error during Google Login.');
            }
          },
        });
      }
    };

    document.querySelectorAll('.google-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!tokenClient) {
          alert('Google Auth is missing the Client ID! Please edit login.html and replace YOUR_GOOGLE_CLIENT_ID_HERE.');
          return;
        }
        tokenClient.requestCode();
      });
    });

    // Auto redirect if admin token exists and they click staff tab
    // (Optional, currently just let them login)
  </script>
</body>

</html>
