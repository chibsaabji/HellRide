<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Details | HellRide</title>
    <meta name="description" content="View comprehensive vehicle specifications, pricing, and gallery details for our elite HellRide fleet.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      /* ── Details page base ────────────────────────────────── */
      .details-hero {
        padding-top: 100px;
        min-height: 100vh;
        background: var(--bg-primary);
      }

      .details-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
        align-items: start;
        margin-top: 2rem;
        padding-bottom: 4rem;
      }

      .gallery-main {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: var(--bg-secondary);
        border: 1px solid var(--glass-border);
      }

      .gallery-main img,
      .gallery-main video {
        width: 100%;
        height: auto;
        display: block;
      }

      .gallery-thumbs {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
        scrollbar-width: thin;
      }

      .gallery-thumbs img,
      .gallery-thumbs video {
        width: 100px;
        height: 70px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: var(--transition);
        flex-shrink: 0;
      }

      .gallery-thumbs img:hover,
      .gallery-thumbs img.active,
      .gallery-thumbs video:hover,
      .gallery-thumbs video.active {
        border-color: var(--accent-olive);
      }

      .details-info h1 {
        font-size: clamp(1.75rem, 3.5vw, 3rem);
        margin-bottom: 0.5rem;
      }

      .details-info .brand-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background: var(--glass-bg);
        border: 1px solid var(--accent-olive);
        color: var(--accent-olive);
        border-radius: 20px;
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
        font-weight: 500;
      }

      .details-price {
        font-size: clamp(1.5rem, 2.5vw, 2rem);
        color: var(--text-main);
        font-weight: 700;
        margin-bottom: 2rem;
      }

      .specs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .spec-item {
        background: var(--bg-secondary);
        padding: 1rem;
        border-radius: 8px;
        border: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .spec-item svg {
        color: var(--accent-olive);
        flex-shrink: 0;
      }

      .spec-item div small {
        color: var(--text-muted);
        display: block;
        margin-bottom: 0.25rem;
        font-size: 0.75rem;
      }

      .spec-item div strong {
        font-size: 1.125rem;
      }

      .details-desc {
        color: var(--text-muted);
        line-height: 1.8;
        font-size: 1.125rem;
        margin-bottom: 3rem;
        white-space: pre-wrap;
      }

      /* ── Laptop (≤ 1280px) ─────────────────────────────────── */
      @media (max-width: 1280px) {
        .details-grid {
          gap: 3rem;
        }
      }

      /* ── Tablet (≤ 1024px) ─────────────────────────────────── */
      @media (max-width: 1024px) {
        .details-grid {
          grid-template-columns: 1fr;
          gap: 2.5rem;
        }

        .details-info h1 {
          font-size: clamp(1.75rem, 5vw, 2.5rem);
        }
      }

      /* ── Mobile-large (≤ 767px) ────────────────────────────── */
      @media (max-width: 767px) {
        .details-hero {
          padding-top: 80px;
        }

        .details-grid {
          gap: 2rem;
          margin-top: 1.5rem;
          padding-bottom: 3rem;
        }

        .gallery-thumbs img,
        .gallery-thumbs video {
          width: 80px;
          height: 56px;
          border-radius: 6px;
        }

        .specs-grid {
          grid-template-columns: 1fr 1fr;
          gap: 0.75rem;
        }

        .spec-item {
          padding: 0.75rem;
          gap: 0.75rem;
        }

        .spec-item div strong {
          font-size: 1rem;
        }

        .details-desc {
          font-size: 1rem;
          margin-bottom: 2rem;
        }

        .details-price {
          font-size: 1.5rem;
          margin-bottom: 1.25rem;
        }
      }

      /* ── Mobile-small (≤ 480px) ────────────────────────────── */
      @media (max-width: 480px) {
        .details-hero {
          padding-top: 72px;
        }

        .details-grid {
          gap: 1.5rem;
          margin-top: 1rem;
          padding-bottom: 2rem;
        }

        .details-info h1 {
          font-size: clamp(1.5rem, 7vw, 2rem);
        }

        .details-price {
          font-size: 1.375rem;
        }

        .specs-grid {
          grid-template-columns: 1fr;
        }

        .gallery-thumbs {
          gap: 0.5rem;
        }

        .gallery-thumbs img,
        .gallery-thumbs video {
          width: 70px;
          height: 50px;
        }

        .details-desc {
          font-size: 0.95rem;
        }
      }
    </style>
